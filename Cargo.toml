[workspace]
resolver = "2"
members = [
    "crates/shared_dsp",
    "crates/pitch",
    "plugins/prism/rust",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
shared_dsp = { path = "crates/shared_dsp" }
pitch = { path = "crates/pitch" }
